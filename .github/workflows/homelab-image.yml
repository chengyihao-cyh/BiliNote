name: Publish Homelab Image

on:
  push:
    branches: [master]
    tags: ['custom-v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: chengyihao-cyh/bilinote

permissions:
  contents: read
  packages: write

concurrency:
  group: homelab-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build CUDA image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve application version
        id: version
        shell: bash
        run: |
          version=$(cat CUSTOM_VERSION)
          if [[ "$GITHUB_REF" == refs/tags/custom-v* ]]; then
            version=${GITHUB_REF_NAME#custom-v}
          else
            version="${version}+${GITHUB_SHA::7}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.complete
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INSTALL_CUDA=true
            TORCH_VERSION=2.6.0
            VITE_APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
